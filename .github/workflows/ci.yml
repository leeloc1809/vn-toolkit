name: CI

# Runner images are pinned deliberately, not for convenience.
#
# `ubuntu-latest` migrates to a new image without warning, which turns a
# conformance suite into a moving target: a green build on main and a red build
# on a PR would differ for reasons nobody can find in a diff. Dependabot flags
# the migration as an error, which is what surfaced this in the first place.
#
# When bumping the pin, change all three jobs together and let CI confirm.

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      # The collate parity step shells out to a real interpreter, so the version
      # is pinned here too rather than inherited from whatever the image ships.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Typecheck
        run: npm run typecheck
      - name: Conformance suite
        run: npm run test
      - name: Build
        run: npm run build
      # Re-implements the Python algorithm in Node and checks it against the
      # same conformance file, so a port drift is caught even on a PR that
      # only touches TypeScript.
      - name: Cross-port parity (vn-text)
        run: npm run verify:ports

      # Runs both real ports over the same corpus and compares sort keys byte
      # for byte. The suite pins the ORDER, which a self-consistent port
      # satisfies on its own; matching keys is the stronger property, and it is
      # the one that decides whether a key written by Node sorts the same way in
      # a database as a key written by Python.
      - name: Cross-port sort-key parity (vn-collate)
        run: npm run verify:collate

      # Formats, parses, apportions and reads out 17000-odd amounts through
      # both real ports and compares the answers directly. The suite pins both
      # to the same expectations; this compares them to each other, which also
      # covers the inputs nobody thought to write a case for.
      - name: Cross-port money parity (vn-money)
        run: npm run verify:money

      # The hand-maintained lists of packages are where a new one gets
      # forgotten, and the failure is silence: an unwatched directory, a
      # package that is built and never released. This is the only thing that
      # reports it.
      - name: Every package is wired into everything that enumerates packages
        run: npm run check:wiring

      # A no-break space or a thin space written as a literal is invisible in
      # an editor, so it survives review and is then silently replaced by a
      # reformat. The VND formatter depends on U+00A0 to match ICU exactly.
      - name: No literal invisible space characters
        run: npm run check:invisible

  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/vn-text-py
          pip install ./packages/vn-collate-py
          pip install ./packages/vn-money-py
          pip install pytest

      # Runs the real interpreter against the shared conformance file, which
      # is the one check the Node-only job cannot make on its own.
      - name: Conformance suite (vn-text)
        run: python packages/vn-text-py/tests/test_vn_text.py

      - name: Conformance suite (vn-collate)
        run: python packages/vn-collate-py/tests/test_vn_collate.py

      - name: Conformance suite (vn-money)
        run: python packages/vn-money-py/tests/test_vn_money.py

      - name: Pytest
        run: |
          pytest packages/vn-text-py/tests packages/vn-collate-py/tests \
                 packages/vn-money-py/tests -q

      # A combining mark is invisible in an editor, so one typed by accident
      # into a lookup table survives a reformat, still imports, and still
      # passes a smoke test. Precomposed letters like U+0110 are fine as
      # literals -- they are visible, and they are what a Vietnamese developer
      # expects to read. The rule is about the invisible ones only.
      - name: No literal combining marks in Python source
        run: |
          python - <<'PY'
          import pathlib, sys, unicodedata

          marks = {"Mn", "Mc", "Me"}
          found = []
          for path in sorted(pathlib.Path("packages").glob("vn-*-py/**/*.py")):
              text = path.read_text(encoding="utf-8")
              hits = [ch for ch in text if unicodedata.category(ch) in marks]
              if hits:
                  shown = " ".join(sorted({f"U+{ord(c):04X}" for c in hits}))
                  found.append((path, shown))

          for path, shown in found:
              print(f"{path}: {shown}")
          if found:
              sys.exit(f"{len(found)} file(s) use literal combining marks; use chr(0xNNNN)")
          print("no literal combining marks")
          PY

  conformance-file:
    name: Conformance file is well-formed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Schema, unique ids, full function coverage
        run: python packages/vn-text-py/tests/test_vn_text.py
      - name: Corpus size did not silently shrink
        run: |
          python - <<'PY'
          import json, sys
          suite = json.load(open("conformance/vn-text-1.0.0.json", encoding="utf-8"))
          cases = suite["cases"]
          print(f"{len(cases)} cases, {len(suite['functions'])} functions")
          if len(cases) < 156:
              sys.exit(f"corpus shrank: {len(cases)} < 156")
          unnoted = [c["id"] for c in cases if not c.get("note")]
          if unnoted:
              print(f"note: {len(unnoted)} cases have no explanatory note")
          PY
      - name: Collation table still matches the suite
        run: |
          python - <<'PY'
          import json, sys
          suite = json.load(open("conformance/vn-collate-1.0.0.json", encoding="utf-8"))
          cases = suite["cases"]
          print(f"{len(cases)} cases")

          # A case count below this means someone deleted cases instead of
          # fixing the port. See CONTRIBUTING.md: a red case is replaced with a
          # new one, never deleted.
          if len(cases) < 519:
              sys.exit(f"corpus shrank: {len(cases)} < 519")

          ids = [c["id"] for c in cases]
          if len(set(ids)) != len(ids):
              sys.exit("duplicate case ids")

          # The tables are the contract. If a port disagrees with them the
          # conformance run above already failed; this pins the values so a
          # regeneration cannot quietly reorder Vietnamese without a diff
          # landing in review.
          #
          # 33 entries, not 29: the 29 letters of the Vietnamese alphabet plus
          # w, y and z, which ICU's vi-VN locale still collates as letters
          # rather than leaving them in the fallback bucket.
          if len(suite["primaryOrder"]) != 33:
              sys.exit(f"primary table changed: {len(suite['primaryOrder'])} letters")
          if suite["digitPlacement"] != "before-all-letters":
              sys.exit(f"digit placement changed: {suite['digitPlacement']}")
          if suite["toneOrder"] != ["none", "huyền", "hỏi", "ngã", "sắc", "nặng"]:
              sys.exit(f"tone order changed: {suite['toneOrder']}")
          if not suite.get("derivedFrom"):
              sys.exit("derivedFrom is empty; the table must record its source runtime")
          print("primary order:", " ".join(suite["primaryOrder"]))
          print("derived from:", suite["derivedFrom"])
          PY

      - name: Money suite still matches ICU and still covers 0-999
        run: |
          python - <<'PY'
          import json, sys
          suite = json.load(open("conformance/vn-money-1.0.0.json", encoding="utf-8"))
          cases = suite["cases"]
          print(f"{len(cases)} cases, {len(suite['functions'])} functions")

          # A case count below this means someone deleted cases instead of
          # fixing the port. See CONTRIBUTING.md: a red case is replaced with a
          # new one, never deleted.
          if len(cases) < 1232:
              sys.exit(f"corpus shrank: {len(cases)} < 1232")

          ids = [c["id"] for c in cases]
          if len(set(ids)) != len(ids):
              sys.exit("duplicate case ids")

          # The whole triplet range, not a sample of it. The reading rules for
          # mốt, tư and lăm all live between 0 and 999, and the values that
          # break them are the ones nobody thinks to write down.
          words = {c["input"]["amount"] for c in cases if c["fn"] == "toWords"}
          gaps = [n for n in range(1000) if n not in words]
          if gaps:
              sys.exit(f"{len(gaps)} values below 1000 are not covered, e.g. {gaps[:5]}")

          # The currency facts every function is defined in terms of. VND having
          # a minor unit of 0 is the reason the whole package works on
          # integers; if ISO ever says otherwise, that is a breaking change and
          # it has to land as a diff, not silently.
          currency = suite["currency"]
          if currency["code"] != "VND":
              sys.exit(f"currency code changed: {currency['code']}")
          if currency["minorUnits"] != 0:
              sys.exit(f"minor units changed: {currency['minorUnits']}")

          # There is no platform to defer to for Vietnamese number reading, so
          # the suite has to state its choice. An unstated convention cannot be
          # reviewed, and a convention that changes is a breaking change.
          convention = suite["readingConvention"]
          for key in ("fillerWord", "unitOne", "unitFour", "unitFive",
                      "tensOne", "emptyTriplet", "magnitudeNames"):
              if key not in convention:
                  sys.exit(f"readingConvention lost {key}")
          for key in ("unitOne", "unitFour", "unitFive", "tensOne", "emptyTriplet"):
              if "alternative" not in convention[key]:
                  sys.exit(f"readingConvention.{key} names no rejected reading")

          if "ICU " not in suite["derivedFrom"]:
              sys.exit(f"derivedFrom does not record the runtime: {suite['derivedFrom']}")

          unnoted = [c["id"] for c in cases if not c.get("note")]
          if unnoted:
              print(f"note: {len(unnoted)} cases have no explanatory note")
          print("covered values below 1000:", len(words))
          print("derived from:", suite["derivedFrom"])
          PY

  packaging:
    name: Published artefacts are complete
    runs-on: ubuntu-24.04
    # Everything here catches a class of bug no unit test can see. A file missing
    # from a tarball still imports perfectly from the repository and only fails
    # once somebody installs the published package -- which is the worst time.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run build

      # Each of these has been proven to fail when the thing it checks is broken.
      # A check that cannot fail is decoration, so they are not written inline in
      # YAML where nobody would notice they stopped working.
      - name: npm tarballs are complete
        run: node scripts/check-tarballs.mjs

      - name: Wheels and sdists are complete
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          for pkg in packages/vn-*-py; do
            node scripts/stage-license.mjs "$pkg"
            python -m build --outdir dist "$pkg"
          done
          python scripts/check-artifacts.py dist

      - name: The four manifests agree on one version
        run: bash scripts/check-release-tag.sh

      - name: The staged LICENSE is never committed
        run: |
          set -euo pipefail
          if git status --porcelain -- 'packages/*/LICENSE' 'packages/*/*/LICENSE' | grep -q .; then
            echo "::error::a staged LICENSE copy is tracked in git"
            git status --porcelain -- 'packages/*/LICENSE' 'packages/*/*/LICENSE'
            exit 1
          fi
          echo "no staged LICENSE copies in git"
