name: Release

# Publishing is the one irreversible thing this repository does, so it is gated
# on a tag and on the full test suite passing. Nothing publishes from a branch.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag has to agree with the version in all four manifests. That is checked
# here rather than trusted, because a mismatch publishes 0.1.0 under a v0.2.0
# tag and nobody notices until someone tries to install the tag.
#
# Authentication works two ways and the workflow picks whichever is available:
#
#   - Trusted publishing (OIDC, no secret). Preferred. Configure it once per
#     package on the registry's website, then delete the token secrets.
#   - API token in a repository secret. Set up in a minute, and it does not
#     expire on a schedule you have to remember.
#
# See RELEASING.md.

on:
  push:
    tags:
      - 'v*'
  # Manual run, for a version already tagged. The tag is taken from the release
  # field so it still has to exist.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the tag matches every manifest
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # A tag push reports refs/tags/v0.1.0; a manual run reports whatever
          # was typed into the dispatch field.
          source_tag="${INPUT_TAG:-${REF#refs/tags/}}"
          if [ -z "$source_tag" ]; then
            echo "::error::no tag given and this is not a tag push"
            exit 1
          fi
          # The manifest list lives in the script, where it is globbed. A second
          # copy here is a second thing to forget when a package is added, and
          # forgetting it means the release refuses forever for a reason nobody
          # can find.
          bash scripts/check-release-tag.sh "$source_tag"
          echo "version=${source_tag#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Typecheck, test, build, both parity checks
        run: npm run verify

      - name: Python conformance, every port
        run: |
          set -euo pipefail
          # Glob the test files themselves rather than deriving a name from the
          # package directory. The directory is vn-collate-py and the file is
          # test_vn_collate.py, and a derivation that forgets to swap the hyphen
          # for an underscore fails at the worst possible moment: during a
          # release, after the tag exists, for a file that was there all along.
          for test in packages/vn-*-py/tests/test_*.py; do
            python "$test"
          done
          python -m pip install --quiet pytest
          pytest packages/vn-*-py/tests -q

      - name: Every package is wired into everything that enumerates packages
        run: npm run check:wiring

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-24.04
    # id-token: write is what makes trusted publishing possible. Without a
    # secret set, the npm CLI exchanges this token for a short-lived credential.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Authenticate
        # Write to the file npm actually reads, which is not ~/.npmrc.
        # setup-node with registry-url sets NPM_CONFIG_USERCONFIG to its own
        # generated path, and that variable overrides the home directory
        # entirely. So the version of this step that wrote ~/.npmrc put a
        # perfectly good token in a file npm never opened, while setup-node's
        # real credential file held an empty _authToken. The run then failed
        # 401 and the publish failed 404, which reads like a missing scope.
        #
        # The secret arrives through env rather than through a ${{ }} spliced
        # into the script body, so a token containing shell metacharacters
        # cannot become part of the script.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Trusted publishing needs no token, and an empty token is worse than
          # none, so the file is only rewritten when there is something to say.
          if [ -n "${NPM_TOKEN}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" \
              > "${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
            echo "using the NPM_TOKEN secret"
          else
            echo "no NPM_TOKEN secret, using trusted publishing"
          fi

      - name: Which npm account is publishing
        # Worth having in the log permanently: when a publish fails on a scope
        # the account cannot write to, the useful fact is which account the
        # token belongs to, and that is the one thing the npm error never says.
        #
        # This also stops the run. The previous version printed
        # "unauthenticated" and carried on regardless, so a rejected token
        # surfaced several steps later as a 404 from the registry.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "userconfig: $(npm config get userconfig)"
          echo "registry: $(npm config get registry)"
          if [ -z "${NPM_TOKEN}" ]; then
            echo "no token set, expecting trusted publishing to supply a credential"
            exit 0
          fi
          if ! account="$(npm whoami 2>&1)"; then
            echo "::error::NPM_TOKEN is set but the registry rejected it"
            echo "$account"
            exit 1
          fi
          echo "account: ${account}"

      - name: Publish
        run: |
          set -euo pipefail
          for pkg in vn-text vn-collate vn-money vn-ident; do
            echo "::group::npm publish $pkg"
            # --provenance attaches the build to the commit, which is what
            # makes the registry badge meaningful. It needs id-token: write.
            npm publish --workspace "$pkg" --provenance --access public
            echo "::endgroup::"
          done

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          for pkg in packages/vn-*-py; do
            node scripts/stage-license.mjs "$pkg"
            python -m build --outdir dist "$pkg"
          done

      - name: Check the artefacts
        run: |
          set -euo pipefail
          ls -la dist
          for f in dist/*.whl; do
            echo "::group::$f"
            python -m zipfile -l "$f"
            echo "::endgroup::"
          done

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Omit the password entirely to use trusted publishing. pypa skips the
          # token when it is absent and falls back to the OIDC exchange.
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
